name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, homelab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site
        run: |
          rm -rf _site && mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='publish.sh' --exclude='README.md' ./ _site/
          ls -la _site | head -40

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: [self-hosted, homelab]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
